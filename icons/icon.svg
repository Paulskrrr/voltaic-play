<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="sky" cx="50%" cy="58%" r="70%">
      <stop offset="0" stop-color="#1b2a58"/>
      <stop offset="0.55" stop-color="#0b1330"/>
      <stop offset="1" stop-color="#05080f"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1c4"/>
      <stop offset="0.4" stop-color="#f3d88a"/>
      <stop offset="1" stop-color="#b8913f"/>
    </linearGradient>
    <linearGradient id="ember" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb08a"/>
      <stop offset="0.45" stop-color="#ff5a2e"/>
      <stop offset="1" stop-color="#d63a12"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff5a2e" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff5a2e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <!-- Deco sunburst fanning up from the V's point -->
  <clipPath id="in"><rect x="58" y="58" width="396" height="396"/></clipPath>
  <g clip-path="url(#in)" stroke="#e6c36e" stroke-opacity="0.16" stroke-width="3">
    <path d="M256 400L40 40M256 400L112 20M256 400L184 8M256 400L256 0M256 400L328 8M256 400L400 20M256 400L472 40M256 400L10 130M256 400L502 130"/>
  </g>
  <!-- double gold frame -->
  <rect x="44" y="44" width="424" height="424" fill="none" stroke="#e6c36e" stroke-opacity="0.75" stroke-width="5"/>
  <rect x="58" y="58" width="396" height="396" fill="none" stroke="#e6c36e" stroke-opacity="0.3" stroke-width="2.5"/>
  <!-- the V: stepped Deco serifs on each arm -->
  <path d="M100 118H206V132H192L256 318L320 132H306V118H412V132H394L286 412H226L118 132H100Z"
        fill="url(#gold)" stroke="#4a3510" stroke-width="5" stroke-linejoin="miter"/>
  <path d="M138 144L246 400" stroke="#fff1c4" stroke-opacity="0.55" stroke-width="3"/>
  <!-- ember bolt striking through the V -->
  <circle cx="262" cy="244" r="150" fill="url(#glow)"/>
  <path d="M290 80L190 262H250L228 412L334 228H274L310 80Z"
        fill="url(#ember)" stroke="#0b1020" stroke-width="10" stroke-linejoin="miter" paint-order="stroke"/>
  <path d="M290 80L190 262H250" fill="none" stroke="#ffd3bd" stroke-width="4" stroke-linejoin="miter"/>
</svg>
